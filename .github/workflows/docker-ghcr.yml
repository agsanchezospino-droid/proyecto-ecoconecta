name: Docker CI/CD & GitHub Container Registry (GHCR)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test-backend:
    name: Pruebas Backend (FastAPI + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecoconecta_test
          POSTGRES_USER: ecoconecta_user
          POSTGRES_PASSWORD: ecoconecta_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias backend
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Ejecutar suite pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://ecoconecta_user:ecoconecta_test_password@localhost:5432/ecoconecta_test
          SECRET_KEY: ci_test_secret_key_for_github_actions_32chars
          PYTHONPATH: .
        run: pytest -v

  build-and-push-docker:
    name: Construir y Publicar Imágenes Docker en GitHub (GHCR)
    runs-on: ubuntu-latest
    needs: test-backend
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Normalizar nombre de imagen en minúsculas
        id: names
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${REPO_LOWER}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar etiquetas y metadatos OCI
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=EcoConecta – Villas de San Pablo (${{ matrix.service }})

      - name: Construir y publicar imagen Docker (${{ matrix.service }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            NEXT_PUBLIC_APP_NAME=EcoConecta – Villas de San Pablo
            NEXT_PUBLIC_WHATSAPP_PUBLIC_NUMBER=${{ vars.WHATSAPP_PUBLIC_NUMBER || '573235017843' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
