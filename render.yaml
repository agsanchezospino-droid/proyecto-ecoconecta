# ==============================================================================
# EcoConecta – Villas de San Pablo
# Render Blueprint (PostgreSQL 16 + Backend FastAPI Docker + Frontend Next.js Docker)
# Despliegue en 1 clic desde GitHub:
#   https://dashboard.render.com/blueprint/new?repo=https://github.com/agsanchezospino-droid/proyecto-ecoconecta
#
# Credenciales opcionales para agregar luego en Render Dashboard -> ecoconecta-backend -> Environment:
#   WHATSAPP_PHONE_NUMBER_ID, WHATSAPP_TOKEN, WHATSAPP_APP_SECRET, OPENAI_API_KEY
# ==============================================================================

databases:
  - name: ecoconecta-db
    plan: free
    databaseName: ecoconecta
    user: ecoconecta_user
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: ecoconecta-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecoconecta-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"
      - key: AUTO_SEED
        value: "true"
      - key: ENABLE_DEMO_QUICK_LOGIN
        value: "true"
      - key: WHATSAPP_PUBLIC_NUMBER
        value: ""
      - key: WHATSAPP_API_VERSION
        value: v21.0
      - key: WHATSAPP_VERIFY_TOKEN
        value: ecoconecta_verify_token_2026
      - key: WHATSAPP_DEFAULT_COUNTRY_CODE
        value: "57"
      - key: OPENAI_TRANSCRIBE_MODEL
        value: gpt-4o-mini-transcribe
      - key: OPENAI_CLASSIFIER_MODEL
        value: gpt-4o-mini

  - type: web
    name: ecoconecta-frontend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: /api/v1
      - key: NEXT_PUBLIC_APP_NAME
        value: EcoConecta – Villas de San Pablo
      - key: NEXT_PUBLIC_WHATSAPP_PUBLIC_NUMBER
        value: ""
      - key: INTERNAL_API_URL
        fromService:
          type: web
          name: ecoconecta-backend
          envVarKey: RENDER_EXTERNAL_URL
